name: Release CLI

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # A tag on an unmerged commit would publish code the required checks never passed.
      - name: Check the tag is on main and matches cli/package.json
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version="$(node -p "require('./cli/package.json').version")"
          test "$GITHUB_REF_NAME" = "cli-v$version" || {
            echo "tag $GITHUB_REF_NAME does not match cli/package.json version $version"
            exit 1
          }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Trusted publishing (OIDC) needs npm 11.5.1 or later; NPM_TOKEN is used when it is set.
      - run: npm install -g npm@11
      - name: Pack
        working-directory: cli
        run: npm pack
      - name: Publish to npm
        working-directory: cli
        run: npm publish "hattisar-$VERSION.tgz" --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create the GitHub release
        run: >
          gh release create "$GITHUB_REF_NAME" "cli/hattisar-$VERSION.tgz"
          --title "hattisar CLI $VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

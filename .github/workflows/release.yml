name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # A tag on an unmerged commit would publish code the required checks never passed.
      - name: Check the tag is on main and matches package.json
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          case "$version" in
            *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;;
          esac
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/itsbohara/hattisar
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image is already pushed, so a failure here stops the release, not the push.
      - name: Smoke-test the image on each platform
        run: |
          for platform in linux/amd64 linux/arm64; do
            out="$(docker run --rm --platform "$platform" "ghcr.io/itsbohara/hattisar:$VERSION" \
              node -e "new (require('better-sqlite3'))(':memory:'); require('pg'); console.log('ok')")"
            test "$out" = ok || { echo "smoke failed on $platform: $out"; exit 1; }
          done
      # The package starts private, and bundle users pull anonymously.
      - name: Check the image is public
        run: |
          docker logout ghcr.io
          docker manifest inspect "ghcr.io/itsbohara/hattisar:$VERSION" >/dev/null
      - name: Pack the compose bundle
        run: sh scripts/release-bundle.sh "$VERSION" "$RUNNER_TEMP"
      - name: Create the GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/hattisar-$VERSION.tar.gz" \
            scripts/install.sh \
            --title "hattisar $VERSION" --generate-notes \
            ${PRERELEASE:+--prerelease}
        env:
          GH_TOKEN: ${{ github.token }}
